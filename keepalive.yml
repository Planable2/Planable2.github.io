# กันโปรเจ็กต์ Supabase (แพ็กเกจฟรี) ถูกพักเมื่อไม่มีการใช้งาน 7 วัน — เรียก API วันละครั้ง
# ตั้งค่า: GitHub repo › Settings › Secrets and variables › Actions › Variables › New variable
#   ชื่อ API_URL  ค่า = ลิงก์ Edge Function เดียวกับใน js/config.js
name: keepalive
on:
  schedule:
    - cron: '17 0 * * *'   # ทุกวัน 07:17 น. เวลาไทย
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -sS -X POST -H 'Content-Type: text/plain' -d '{"action":"ping"}' "${{ vars.API_URL }}"
