# ดึงราคาวัสดุจากกระทรวงพาณิชย์ทุกเช้า — ขั้นตอนจริงอยู่ใน tools/material-price.sh (แก้ไฟล์นั้นแทน ไม่ต้องแก้ไฟล์นี้)
# ใช้ Variables: API_URL • Secrets: FUEL_API_KEY
name: material-price
on:
  schedule:
    - cron: '20 1 * * *'   # 08:20 น. เวลาไทย
  workflow_dispatch:
    inputs:
      months:
        description: 'ดึงอย่างน้อยกี่เดือน (ว่าง = อัตโนมัติ)'
        required: false
        default: ''
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ดึงราคาวัสดุแล้วส่งเข้าระบบ
        env:
          API_URL: ${{ vars.API_URL }}
          FUEL_API_KEY: ${{ secrets.FUEL_API_KEY }}
          MONTHS: ${{ github.event.inputs.months }}
        run: bash tools/material-price.sh
