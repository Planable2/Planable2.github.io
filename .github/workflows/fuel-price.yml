# ดึงราคาน้ำมันจาก PTT OR ทุกเช้า — ขั้นตอนจริงอยู่ใน tools/fuel-price.sh (แก้ไฟล์นั้นแทน ไม่ต้องแก้ไฟล์นี้)
# ใช้ Variables: API_URL • Secrets: FUEL_API_KEY
name: fuel-price
on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 น. เวลาไทย
  workflow_dispatch:
    inputs:
      months:
        description: 'ดึงย้อนหลังกี่เดือน (ว่าง = อัตโนมัติ)'
        required: false
        default: ''
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ดึงราคาน้ำมันแล้วส่งเข้าระบบ
        env:
          API_URL: ${{ vars.API_URL }}
          FUEL_API_KEY: ${{ secrets.FUEL_API_KEY }}
          MONTHS: ${{ github.event.inputs.months }}
        run: bash tools/fuel-price.sh
